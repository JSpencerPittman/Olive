<!DOCTYPE html>
<html>

<body>
    <h1>Structure Search</h1>
    <h2>Project Directory</h2>
    <form method="POST" action="set-proj-dir">
        <input type="text" name="proj-dir">
        <input type="submit" value="Submit">
    </form>
    <h2>Find File</h2>
    <div class="search-container">
        <input type="search" id="search" placeholder="Search..." autocomplete="False">
        <ul id="search-results" role="listbox"></ul>
    </div>
    <h2>Structures</h2>
    <div id="struct-display-container">
        <div id="struct-sel-container">
            <div class="struct-sel">
                {% for struct in structs %}
                    <button onclick="makeSelection('left', '{{ struct.name }}')">{{ struct.name }}</button>
                {% endfor %}
            </div>
        </div>
        <div id="struct-disp-container">
            <div class="struct-disp" id="left-struct-disp"></div>
        </div>
        <div id="struct-ref-container">
            <div class="struct-ref" id="left-struct-ref"></div>
        </div>
    </div>
    <script src="static/struct_search.js"></script>
</body>
</html>
